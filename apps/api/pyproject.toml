[project]
name = "ghostdodo-api"
version = "0.1.0"
description = "GhostDodo API — recruitment communication transparency"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "redis>=6.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "argon2-cffi>=25.1",
    "aioboto3>=15.0",
    "structlog>=25.4",
    "orjson>=3.11",
    "email-validator>=2.2",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-aioboto3[s3]>=15.0",
    "asgi-lifespan>=2.1",
    "types-defusedxml>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF", "ASYNC", "S"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the idiom
    "RUF001", # ambiguous unicode: Korean copy lives in this codebase
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point
"app/db/migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
warn_unreachable = true
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
