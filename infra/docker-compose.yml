# GhostDodo local services.
# Usage: docker compose -f infra/docker-compose.yml up -d
name: ghostdodo

services:
  postgres:
    image: postgres:16-alpine
    container_name: ghostdodo-postgres
    environment:
      POSTGRES_USER: ghostdodo
      POSTGRES_PASSWORD: ghostdodo
      POSTGRES_DB: ghostdodo
      # Korean company search relies on unaccent/pg_trgm; C collation keeps
      # trigram behaviour predictable across dev machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostdodo -d ghostdodo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ghostdodo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for evidence. Bucket is private.
  minio:
    image: minio/minio:latest
    container_name: ghostdodo-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ghostdodo
      MINIO_ROOT_PASSWORD: ghostdodo_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the private evidence bucket.
  minio-init:
    image: minio/mc:latest
    container_name: ghostdodo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ghostdodo ghostdodo_dev_secret &&
      mc mb --ignore-existing local/ghostdodo-evidence-dev &&
      mc anonymous set none local/ghostdodo-evidence-dev &&
      echo 'evidence bucket ready (private)'
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
